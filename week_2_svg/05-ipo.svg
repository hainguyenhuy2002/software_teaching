<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc"><title id="title">Follow the data through a calculation</title><desc id="desc">Quantity 3 and membership True select unit price 10, produce total 30, and display 30 dollars. The button triggers processing.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="60" width="285" height="350" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="40" y="96" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">INPUT</text><text x="40" y="137" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Quantity: 3</text><text x="40" y="168" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Member: True</text><text x="40" y="199" font-size="22" fill="#172b38" text-anchor="start" font-weight="400"></text><text x="40" y="230" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Read both values</text><text x="40" y="261" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">from the controls.</text><rect x="395" y="60" width="350" height="350" rx="10" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="415" y="96" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">PROCESS</text><text x="415" y="137" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Choose the unit price:</text><text x="415" y="168" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">True  →  10</text><text x="415" y="199" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">False →  12</text><text x="415" y="230" font-size="22" fill="#172b38" text-anchor="start" font-weight="400"></text><text x="415" y="261" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Use True here:</text><text x="415" y="292" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">3 × 10 = 30</text><rect x="835" y="60" width="265" height="350" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="855" y="96" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">OUTPUT</text><text x="855" y="137" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Total: $30.00</text><text x="855" y="168" font-size="22" fill="#172b38" text-anchor="start" font-weight="400"></text><text x="855" y="199" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Change the label</text><text x="855" y="230" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">so the user can</text><text x="855" y="261" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">read the result.</text><path d="M320,230 L380,230" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><path d="M760,230 L820,230" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><rect x="245" y="450" width="630" height="64" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="560" y="491" font-size="24" fill="#245c82" text-anchor="middle" font-weight="700">Calculate total triggers this sequence.</text></g></svg>