<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">One click, one callback call</title><desc id="desc">Four clockwise stages: the event loop waits, the button is activated, the callback executes, and control returns to the event loop.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="50" y="55" width="420" height="155" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="70" y="91" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">1  Wait for an event</text><text x="70" y="132" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The window is ready.</text><text x="70" y="163" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The event loop is active.</text><rect x="650" y="55" width="420" height="155" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="670" y="91" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">2  Activate Calculate</text><text x="670" y="132" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The button event requests</text><text x="670" y="163" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">its connected callback.</text><rect x="650" y="335" width="420" height="195" rx="10" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="670" y="371" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">3  Run on_calculate</text><text x="670" y="412" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Read and check the inputs.</text><text x="670" y="443" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Show the total or feedback</text><text x="670" y="474" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">in the result label.</text><rect x="50" y="335" width="420" height="195" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="70" y="371" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">4  Finish this call</text><text x="70" y="412" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The callback returns.</text><text x="70" y="443" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The event loop can handle</text><text x="70" y="474" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">the next action.</text><path d="M485,130 L635,130" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><path d="M860,225 L860,320" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><path d="M635,430 L485,430" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><path d="M260,320 L260,225" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="560" y="281" font-size="24" fill="#50616d" text-anchor="middle" font-weight="400">Follow the arrows clockwise.</text><text x="560" y="580" font-size="23" fill="#50616d" text-anchor="middle" font-weight="400">Another click runs the callback again. It does not restart setup.</text></g></svg>