<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">From typed text to displayed price</title><desc id="desc">Five downward steps show operation, value, and type: field text, string 3, integer 3, integer 36 for three standard tickets, then formatted text.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="110" y="38" font-size="21" fill="#245c82" text-anchor="start" font-weight="700">STEP / OPERATION</text><text x="735" y="38" font-size="21" fill="#245c82" text-anchor="start" font-weight="700">VALUE</text><text x="940" y="38" font-size="21" fill="#245c82" text-anchor="start" font-weight="700">KIND</text><rect x="90" y="67" width="1010" height="94" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><circle cx="48" cy="112" r="17" fill="#245c82"/><text x="48" y="119" font-size="21" fill="white" text-anchor="middle" font-weight="700">1</text><path d="M48,133 L48,198" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="110" y="102" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Type into the field</text><text x="110" y="137" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">User enters a quantity.</text><text x="735" y="120" font-size="27" fill="#126b62" text-anchor="start" font-weight="700">3</text><text x="940" y="120" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Screen text</text><rect x="90" y="179" width="1010" height="94" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><circle cx="48" cy="224" r="17" fill="#245c82"/><text x="48" y="231" font-size="21" fill="white" text-anchor="middle" font-weight="700">2</text><path d="M48,245 L48,310" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="110" y="214" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Read: raw_quantity = quantity_entry.get()</text><text x="110" y="249" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">The field supplies text.</text><text x="735" y="232" font-size="27" fill="#126b62" text-anchor="start" font-weight="700">&quot;3&quot;</text><text x="940" y="232" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">String</text><rect x="90" y="291" width="1010" height="94" rx="10" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><circle cx="48" cy="336" r="17" fill="#245c82"/><text x="48" y="343" font-size="21" fill="white" text-anchor="middle" font-weight="700">3</text><path d="M48,357 L48,422" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="110" y="326" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Convert: quantity = int(raw_quantity)</text><text x="110" y="361" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Prepare a whole number.</text><text x="735" y="344" font-size="27" fill="#126b62" text-anchor="start" font-weight="700">3</text><text x="940" y="344" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Integer</text><rect x="90" y="403" width="1010" height="94" rx="10" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><circle cx="48" cy="448" r="17" fill="#245c82"/><text x="48" y="455" font-size="21" fill="white" text-anchor="middle" font-weight="700">4</text><path d="M48,469 L48,534" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="110" y="438" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Calculate: total = quantity * 12</text><text x="110" y="473" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Standard price: Member = False.</text><text x="735" y="456" font-size="27" fill="#126b62" text-anchor="start" font-weight="700">36</text><text x="940" y="456" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Integer</text><rect x="90" y="515" width="1010" height="94" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><circle cx="48" cy="560" r="17" fill="#245c82"/><text x="48" y="567" font-size="21" fill="white" text-anchor="middle" font-weight="700">5</text><text x="110" y="550" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Format: f&quot;${total:.2f}&quot;</text><text x="110" y="585" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Prepare the displayed price.</text><text x="735" y="568" font-size="27" fill="#126b62" text-anchor="start" font-weight="700">&quot;$36.00&quot;</text><text x="940" y="568" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">String</text><text x="560" y="664" font-size="23" fill="#50616d" text-anchor="middle" font-weight="400">A string holds text. An integer supports whole-number arithmetic.</text></g></svg>