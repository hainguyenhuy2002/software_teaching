<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">Rows and columns describe screen positions</title><desc id="desc">The quantity entry occupies row zero column one. Lower controls begin in column zero and span two columns.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="405" y="45" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">column 0</text><text x="850" y="45" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">column 1</text><rect x="190" y="80" width="890" height="90" rx="0" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="80" y="134" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">row 0</text><rect x="190" y="180" width="890" height="90" rx="0" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="80" y="234" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">row 1</text><rect x="190" y="280" width="890" height="90" rx="0" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="80" y="334" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">row 2</text><rect x="190" y="380" width="890" height="90" rx="0" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="80" y="434" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">row 3</text><rect x="660" y="80" width="420" height="90" rx="0" fill="#e7f3ee" stroke="#126b62" stroke-width="2"/><text x="215" y="137" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Number of tickets (1–5):</text><rect x="730" y="102" width="270" height="46" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="748" y="134" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">3</text><rect x="215" y="212" width="25" height="25" rx="3" fill="white" stroke="#50616d" stroke-width="2"/><text x="255" y="235" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Club member</text><rect x="215" y="303" width="270" height="46" rx="5" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="350" y="334" font-size="22" fill="#245c82" text-anchor="middle" font-weight="400">Calculate total</text><text x="215" y="435" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Last calculated total: --</text><text x="560" y="520" font-size="23" fill="#126b62" text-anchor="middle" font-weight="700">Highlighted cell: quantity_entry.grid(row=0, column=1)</text><text x="560" y="564" font-size="22" fill="#50616d" text-anchor="middle" font-weight="400">The lower widgets start in column 0 and use columnspan=2.</text></g></svg>