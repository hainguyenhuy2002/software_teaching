<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Choose a control for the task</title><desc id="desc">Six widgets with examples and their information or action. Radio buttons select one related choice; checkboxes represent independent choices.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="15" width="520" height="190" rx="10" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="40" y="48" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Label</text><rect x="580" y="15" width="520" height="190" rx="10" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="600" y="48" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Text field</text><rect x="20" y="220" width="520" height="190" rx="10" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="40" y="253" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Button</text><rect x="580" y="220" width="520" height="190" rx="10" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="600" y="253" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Checkbox</text><rect x="20" y="425" width="520" height="190" rx="10" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="40" y="458" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Radio-button group</text><rect x="580" y="425" width="520" height="190" rx="10" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="600" y="458" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Dropdown list</text><text x="40" y="101" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Last calculated total: $36.00</text><text x="40" y="151" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Shows information.</text><text x="40" y="179" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">The user does not type into it.</text><rect x="600" y="69" width="470" height="45" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="616" y="100" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Alex</text><text x="600" y="151" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Accepts typed text.</text><text x="600" y="179" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Read value: &quot;Alex&quot; (string).</text><rect x="40" y="273" width="240" height="48" rx="6" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="160" y="305" font-size="22" fill="#245c82" text-anchor="middle" font-weight="700">Calculate total</text><text x="40" y="356" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Requests an action.</text><text x="40" y="384" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Activation can run a callback.</text><rect x="600" y="283" width="25" height="25" rx="3" fill="white" stroke="#50616d" stroke-width="2"/><path d="M604,295 l6,7 l12,-15" fill="none" stroke="#126b62" stroke-width="3"/><text x="642" y="305" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Email reminders</text><text x="600" y="356" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Independent yes/no choice.</text><text x="600" y="384" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Selected: True. Unselected: False.</text><circle cx="55" cy="503" r="12" fill="white" stroke="#50616d" stroke-width="2"/><text x="75" y="510" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Small</text><circle cx="205" cy="503" r="12" fill="white" stroke="#50616d" stroke-width="2"/><circle cx="205" cy="503" r="6" fill="#126b62"/><text x="225" y="510" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Medium</text><circle cx="385" cy="503" r="12" fill="white" stroke="#50616d" stroke-width="2"/><text x="405" y="510" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Large</text><text x="40" y="561" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">One choice within a connected group.</text><text x="40" y="589" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Selected value: &quot;Medium&quot;.</text><rect x="600" y="477" width="470" height="45" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="617" y="508" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Town hall</text><text x="1038" y="506" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">▼</text><text x="600" y="561" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Choose an item from a list.</text><text x="600" y="589" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Selected value: &quot;Town hall&quot;.</text></g></svg>