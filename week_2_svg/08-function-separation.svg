<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">Return a value, then display it</title><desc id="desc">Five numbered steps trace values from controls through the callback and calculation function, back to the callback, then into a label.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="100" width="280" height="240" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="40" y="136" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">1  Read the controls</text><text x="40" y="177" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Entry: &quot;3&quot;</text><text x="40" y="208" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Member: False</text><text x="40" y="239" font-size="22" fill="#172b38" text-anchor="start" font-weight="400"></text><text x="40" y="270" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Text and a Boolean.</text><rect x="400" y="45" width="320" height="390" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="420" y="81" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Callback: on_calculate</text><text x="420" y="122" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">2  Check and convert.</text><text x="420" y="153" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">    quantity becomes 3.</text><text x="420" y="184" font-size="22" fill="#172b38" text-anchor="start" font-weight="400"></text><text x="420" y="215" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">3  Call the calculation.</text><text x="420" y="246" font-size="22" fill="#172b38" text-anchor="start" font-weight="400"></text><text x="420" y="277" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">4  Receive its result.</text><text x="420" y="308" font-size="22" fill="#172b38" text-anchor="start" font-weight="400"></text><text x="420" y="339" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">5  Update the label.</text><rect x="820" y="100" width="280" height="240" rx="10" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="840" y="136" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Calculation function</text><text x="840" y="177" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">calculate_total</text><text x="840" y="208" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">(3, False)</text><text x="840" y="239" font-size="22" fill="#172b38" text-anchor="start" font-weight="400"></text><text x="840" y="270" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">3 × 12 = 36</text><text x="840" y="301" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Return 36.</text><path d="M315,180 L385,180" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="350" y="160" font-size="20" fill="#245c82" text-anchor="middle" font-weight="400">read</text><path d="M735,160 L805,160" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="770" y="140" font-size="18" fill="#245c82" text-anchor="middle" font-weight="400">3, False</text><path d="M805,300 L735,300" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="770" y="328" font-size="22" fill="#126b62" text-anchor="middle" font-weight="700">36</text><path d="M560,450 L560,505" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="584" y="486" font-size="21" fill="#245c82" text-anchor="start" font-weight="400">.configure(...)</text><rect x="285" y="520" width="550" height="90" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="560" y="555" font-size="20" fill="#245c82" text-anchor="middle" font-weight="700">RESULT LABEL</text><text x="560" y="590" font-size="25" fill="#126b62" text-anchor="middle" font-weight="400">Last calculated total: $36.00</text><text x="560" y="660" font-size="23" fill="#50616d" text-anchor="middle" font-weight="400">Returning 36 supplies a value. Updating the label makes it visible.</text></g></svg>