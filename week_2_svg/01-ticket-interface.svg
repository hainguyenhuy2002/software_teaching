<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">Read the screen by its parts</title><desc id="desc">Numbers connect five screen components to their purposes. The field and checkbox supply data, the button requests an action, and the label shows output.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="39" font-size="22" fill="#245c82" text-anchor="start" font-weight="700">THE SCREEN</text><text x="670" y="39" font-size="22" fill="#245c82" text-anchor="start" font-weight="700">WHAT EACH PART DOES</text><rect x="60" y="65" width="550" height="400" rx="10" fill="white" stroke="#b9cbd6" stroke-width="2"/><rect x="60" y="65" width="550" height="58" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="86" y="103" font-size="25" fill="#245c82" text-anchor="start" font-weight="700">Club ticket calculator</text><text x="85" y="180" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Number of tickets (1–5):</text><rect x="385" y="148" width="185" height="46" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="402" y="180" font-size="24" fill="#172b38" text-anchor="start" font-weight="400">3</text><rect x="85" y="223" width="25" height="25" rx="3" fill="white" stroke="#50616d" stroke-width="2"/><text x="125" y="246" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Club member</text><rect x="85" y="285" width="250" height="54" rx="6" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="210" y="320" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">Calculate total</text><text x="85" y="409" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Last calculated total: --</text><circle cx="42" cy="94" r="17" fill="#245c82"/><text x="42" y="101" font-size="21" fill="white" text-anchor="middle" font-weight="700">1</text><circle cx="592" cy="173" r="17" fill="#245c82"/><text x="592" y="180" font-size="21" fill="white" text-anchor="middle" font-weight="700">2</text><circle cx="42" cy="238" r="17" fill="#245c82"/><text x="42" y="245" font-size="21" fill="white" text-anchor="middle" font-weight="700">3</text><circle cx="42" cy="312" r="17" fill="#245c82"/><text x="42" y="319" font-size="21" fill="white" text-anchor="middle" font-weight="700">4</text><circle cx="42" cy="402" r="17" fill="#245c82"/><text x="42" y="409" font-size="21" fill="white" text-anchor="middle" font-weight="700">5</text><circle cx="687" cy="93" r="17" fill="#245c82"/><text x="687" y="100" font-size="21" fill="white" text-anchor="middle" font-weight="700">1</text><text x="720" y="99" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Window</text><text x="720" y="129" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Holds the interface.</text><circle cx="687" cy="175" r="17" fill="#245c82"/><text x="687" y="182" font-size="21" fill="white" text-anchor="middle" font-weight="700">2</text><text x="720" y="181" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Text field — input</text><text x="720" y="211" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Stores the quantity as text.</text><circle cx="687" cy="257" r="17" fill="#245c82"/><text x="687" y="264" font-size="21" fill="white" text-anchor="middle" font-weight="700">3</text><text x="720" y="263" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Checkbox — input</text><text x="720" y="293" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Stores the membership choice.</text><circle cx="687" cy="339" r="17" fill="#245c82"/><text x="687" y="346" font-size="21" fill="white" text-anchor="middle" font-weight="700">4</text><text x="720" y="345" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Button — action</text><text x="720" y="375" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Requests a new calculation.</text><circle cx="687" cy="421" r="17" fill="#245c82"/><text x="687" y="428" font-size="21" fill="white" text-anchor="middle" font-weight="700">5</text><text x="720" y="427" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">Label — output</text><text x="720" y="457" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Shows a result or a message.</text></g></svg>