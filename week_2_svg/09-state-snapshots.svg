<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">Input state and calculated output change separately</title><desc id="desc">A four-screen timeline shows entry, standard calculation, membership changed without recalculation, then a new calculation. The old output remains until step four.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="40" width="500" height="265" rx="10" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="40" y="75" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">1  Enter quantity; ready to calculate</text><text x="40" y="123" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity:</text><rect x="160" y="93" width="92" height="42" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="176" y="122" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">3</text><rect x="305" y="101" width="25" height="25" rx="3" fill="white" stroke="#50616d" stroke-width="2"/><text x="345" y="123" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Member</text><rect x="40" y="156" width="210" height="43" rx="5" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="145" y="185" font-size="21" fill="#245c82" text-anchor="middle" font-weight="400">Calculate total</text><text x="40" y="238" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Last calculated total:</text><text x="298" y="238" font-size="26" fill="#126b62" text-anchor="start" font-weight="700">--</text><text x="40" y="280" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">No calculation has run yet.</text><rect x="600" y="40" width="500" height="265" rx="10" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="620" y="75" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">2  Activate Calculate</text><text x="620" y="123" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity:</text><rect x="740" y="93" width="92" height="42" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="756" y="122" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">3</text><rect x="885" y="101" width="25" height="25" rx="3" fill="white" stroke="#50616d" stroke-width="2"/><text x="925" y="123" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Member</text><rect x="620" y="156" width="210" height="43" rx="5" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="725" y="185" font-size="21" fill="#245c82" text-anchor="middle" font-weight="400">Calculate total</text><text x="620" y="238" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Last calculated total:</text><text x="878" y="238" font-size="26" fill="#126b62" text-anchor="start" font-weight="700">$36.00</text><text x="620" y="280" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">Uses the standard price: 3 × 12.</text><rect x="20" y="440" width="500" height="265" rx="10" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="40" y="475" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">3  Select Member only</text><text x="40" y="523" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity:</text><rect x="160" y="493" width="92" height="42" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="176" y="522" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">3</text><rect x="305" y="501" width="25" height="25" rx="3" fill="white" stroke="#50616d" stroke-width="2"/><path d="M309,513 l6,7 l12,-15" fill="none" stroke="#126b62" stroke-width="3"/><text x="345" y="523" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Member</text><rect x="40" y="556" width="210" height="43" rx="5" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="145" y="585" font-size="21" fill="#245c82" text-anchor="middle" font-weight="400">Calculate total</text><text x="40" y="638" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Last calculated total:</text><text x="298" y="638" font-size="26" fill="#126b62" text-anchor="start" font-weight="700">$36.00</text><text x="40" y="680" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">Input changed; this is still the earlier quote.</text><rect x="600" y="440" width="500" height="265" rx="10" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="620" y="475" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">4  Activate Calculate again</text><text x="620" y="523" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity:</text><rect x="740" y="493" width="92" height="42" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="756" y="522" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">3</text><rect x="885" y="501" width="25" height="25" rx="3" fill="white" stroke="#50616d" stroke-width="2"/><path d="M889,513 l6,7 l12,-15" fill="none" stroke="#126b62" stroke-width="3"/><text x="925" y="523" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Member</text><rect x="620" y="556" width="210" height="43" rx="5" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="725" y="585" font-size="21" fill="#245c82" text-anchor="middle" font-weight="400">Calculate total</text><text x="620" y="638" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Last calculated total:</text><text x="878" y="638" font-size="26" fill="#126b62" text-anchor="start" font-weight="700">$30.00</text><text x="620" y="680" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">Reads the current choice: 3 × 10.</text><path d="M535,170 L585,170" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><path d="M850,320 L850,355 L270,355 L270,425" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="560" y="395" font-size="22" fill="#245c82" text-anchor="middle" font-weight="400">Next action: select Member, without calculating.</text><path d="M535,570 L585,570" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><text x="560" y="762" font-size="23" fill="#50616d" text-anchor="middle" font-weight="400">In this calculator, changing an input does not automatically recalculate.</text></g></svg>