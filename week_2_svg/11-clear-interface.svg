<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Explain the input, action and result</title><desc id="desc">Matching numbers compare vague and specific wording, then explain which user question each change answers.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="25" width="520" height="315" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="40" y="61" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Vague wording</text><rect x="580" y="25" width="520" height="315" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="600" y="61" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Specific wording</text><circle cx="55" cy="123" r="17" fill="#245c82"/><text x="55" y="130" font-size="21" fill="white" text-anchor="middle" font-weight="700">1</text><text x="85" y="130" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Data:</text><rect x="195" y="101" width="305" height="43" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><circle cx="615" cy="123" r="17" fill="#245c82"/><text x="615" y="130" font-size="21" fill="white" text-anchor="middle" font-weight="700">1</text><text x="645" y="130" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Tickets (whole number, 1–5):</text><rect x="970" y="101" width="90" height="43" rx="4" fill="white" stroke="#b9cbd6" stroke-width="2"/><circle cx="55" cy="200" r="17" fill="#245c82"/><text x="55" y="207" font-size="21" fill="white" text-anchor="middle" font-weight="700">2</text><rect x="85" y="176" width="150" height="48" rx="5" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="160" y="208" font-size="23" fill="#245c82" text-anchor="middle" font-weight="400">Go</text><circle cx="615" cy="200" r="17" fill="#245c82"/><text x="615" y="207" font-size="21" fill="white" text-anchor="middle" font-weight="700">2</text><rect x="645" y="176" width="260" height="48" rx="5" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="775" y="208" font-size="23" fill="#245c82" text-anchor="middle" font-weight="400">Calculate total</text><circle cx="55" cy="280" r="17" fill="#245c82"/><text x="55" y="287" font-size="21" fill="white" text-anchor="middle" font-weight="700">3</text><text x="85" y="287" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Result: 36</text><circle cx="615" cy="280" r="17" fill="#245c82"/><text x="615" y="287" font-size="21" fill="white" text-anchor="middle" font-weight="700">3</text><text x="645" y="287" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Last calculated total: $36.00</text><circle cx="55" cy="395" r="17" fill="#245c82"/><text x="55" y="402" font-size="21" fill="white" text-anchor="middle" font-weight="700">1</text><text x="88" y="401" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">What should I enter?</text><text x="88" y="431" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The field label names the input and its rules.</text><circle cx="55" cy="473" r="17" fill="#245c82"/><text x="55" y="480" font-size="21" fill="white" text-anchor="middle" font-weight="700">2</text><text x="88" y="479" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">What will this button do?</text><text x="88" y="509" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The caption describes the action.</text><circle cx="55" cy="551" r="17" fill="#245c82"/><text x="55" y="558" font-size="21" fill="white" text-anchor="middle" font-weight="700">3</text><text x="88" y="557" font-size="23" fill="#245c82" text-anchor="start" font-weight="700">What does this number mean?</text><text x="88" y="587" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The output label explains the value and its timing.</text></g></svg>