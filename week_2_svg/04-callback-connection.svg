<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="535" viewBox="0 0 1120 535" role="img" aria-labelledby="title desc"><title id="title">Connect now, run on a later click</title><desc id="desc">A function reference connects a callback. Adding brackets calls the function during setup and passes its return value instead.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="20" y="25" width="520" height="420" rx="10" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="40" y="61" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Connect the function for later</text><rect x="580" y="25" width="520" height="420" rx="10" fill="#fff0ee" stroke="#b9cbd6" stroke-width="2"/><text x="600" y="61" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Call the function immediately</text><text x="45" y="111" font-size="25" fill="#126b62" text-anchor="start" font-weight="700">command=on_calculate</text><text x="45" y="160" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">During setup:</text><text x="45" y="192" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The button receives the function.</text><text x="45" y="224" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Its calculation does not run yet.</text><path d="M280,245 L280,285" fill="none" stroke="#126b62" stroke-width="3" marker-end="url(#teal)"/><text x="45" y="326" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">When the button is activated:</text><text x="45" y="358" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">The connected function runs.</text><text x="605" y="111" font-size="25" fill="#a02f31" text-anchor="start" font-weight="700">command=on_calculate()</text><text x="605" y="160" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">During setup:</text><text x="605" y="192" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Python runs the function now.</text><text x="605" y="224" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">It may read unfinished widgets.</text><path d="M840,245 L840,285" fill="none" stroke="#a02f31" stroke-width="3" marker-end="url(#red)"/><text x="605" y="326" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">If this callback finishes:</text><text x="605" y="358" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Its returned None is passed on,</text><text x="605" y="390" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">rather than the function itself.</text><text x="560" y="495" font-size="23" fill="#50616d" text-anchor="middle" font-weight="400">Without round brackets (): pass the function.    With (): call it now.</text></g></svg>