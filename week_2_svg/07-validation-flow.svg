<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc"><title id="title">Three checks before calculation</title><desc id="desc">Existence, integer conversion, and range checks lead downward to calculation. Each failure shows its message and ends only the current callback.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a02f31"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#126b62"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="65" y="15" width="490" height="64" rx="10" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="310" y="56" font-size="22" fill="#245c82" text-anchor="middle" font-weight="700">Read text; remove surrounding spaces.</text><polygon points="310,117 555,165 310,213 65,165" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="310" y="172" font-size="22" fill="#172b38" text-anchor="middle" font-weight="400">Is there a value?</text><path d="M570,165 L685,165" fill="none" stroke="#a02f31" stroke-width="3" marker-end="url(#red)"/><text x="625" y="151" font-size="21" fill="#a02f31" text-anchor="middle" font-weight="700">No</text><rect x="700" y="108" width="400" height="115" rx="10" fill="#fff0ee" stroke="#a02f31" stroke-width="2"/><text x="720" y="142" font-size="21" fill="#a02f31" text-anchor="start" font-weight="700">Blank text</text><text x="720" y="176" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Enter the number of tickets.</text><text x="720" y="207" font-size="20" fill="#a02f31" text-anchor="start" font-weight="400">Show feedback; then return.</text><polygon points="310,287 555,335 310,383 65,335" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="310" y="342" font-size="22" fill="#172b38" text-anchor="middle" font-weight="400">Can it become an integer?</text><path d="M570,335 L685,335" fill="none" stroke="#a02f31" stroke-width="3" marker-end="url(#red)"/><text x="625" y="321" font-size="21" fill="#a02f31" text-anchor="middle" font-weight="700">No</text><rect x="700" y="278" width="400" height="115" rx="10" fill="#fff0ee" stroke="#a02f31" stroke-width="2"/><text x="720" y="312" font-size="21" fill="#a02f31" text-anchor="start" font-weight="700">Text such as &quot;three&quot; or &quot;3.5&quot;</text><text x="720" y="346" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Enter a whole number.</text><text x="720" y="377" font-size="20" fill="#a02f31" text-anchor="start" font-weight="400">Show feedback; then return.</text><polygon points="310,457 555,505 310,553 65,505" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="310" y="512" font-size="22" fill="#172b38" text-anchor="middle" font-weight="400">Is it from 1 to 5?</text><path d="M570,505 L685,505" fill="none" stroke="#a02f31" stroke-width="3" marker-end="url(#red)"/><text x="625" y="491" font-size="21" fill="#a02f31" text-anchor="middle" font-weight="700">No</text><rect x="700" y="448" width="400" height="115" rx="10" fill="#fff0ee" stroke="#a02f31" stroke-width="2"/><text x="720" y="482" font-size="21" fill="#a02f31" text-anchor="start" font-weight="700">A number such as 0 or 6</text><text x="720" y="516" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Enter a quantity from 1 to 5.</text><text x="720" y="547" font-size="20" fill="#a02f31" text-anchor="start" font-weight="400">Show feedback; then return.</text><path d="M310,84 L310,109" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#blue)"/><path d="M310,220 L310,280" fill="none" stroke="#126b62" stroke-width="3" marker-end="url(#teal)"/><text x="345" y="257.0" font-size="20" fill="#126b62" text-anchor="start" font-weight="700">Yes</text><path d="M310,390 L310,450" fill="none" stroke="#126b62" stroke-width="3" marker-end="url(#teal)"/><text x="345" y="427.0" font-size="20" fill="#126b62" text-anchor="start" font-weight="700">Yes</text><path d="M310,560 L310,625" fill="none" stroke="#126b62" stroke-width="3" marker-end="url(#teal)"/><text x="345" y="599.5" font-size="20" fill="#126b62" text-anchor="start" font-weight="700">Yes</text><rect x="65" y="638" width="490" height="72" rx="10" fill="#e7f3ee" stroke="#126b62" stroke-width="2"/><text x="310" y="683" font-size="24" fill="#126b62" text-anchor="middle" font-weight="700">Calculate and display the total.</text><text x="900" y="655" font-size="21" fill="#50616d" text-anchor="middle" font-weight="400">return ends this callback call.</text><text x="900" y="686" font-size="21" fill="#50616d" text-anchor="middle" font-weight="400">The window remains open</text><text x="900" y="717" font-size="21" fill="#50616d" text-anchor="middle" font-weight="400">for the next attempt.</text></g></svg>