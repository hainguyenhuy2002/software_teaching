<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Resizing keeps labels and actions usable</title><desc id="desc">A narrow and wide form show the same aligned labels, expanding input fields, visible feedback and action buttons, with a planned keyboard route.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Make extra space help the task</text><rect x="30" y="95" width="405" height="370" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="50" y="135" font-size="25" fill="#245c82" text-anchor="start" font-weight="700">Narrow view</text><text x="50" y="195" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Borrower:</text><rect x="167" y="165" width="245" height="45" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="179" y="196" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Noah</text><text x="50" y="259" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity:</text><rect x="167" y="229" width="245" height="45" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="179" y="260" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">9</text><text x="50" y="320" font-size="20" fill="#a23a3a" text-anchor="start" font-weight="400">Enter a quantity from 1 to 5.</text><rect x="50" y="368" width="175" height="42" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="137.5" y="396" font-size="19" fill="#245c82" text-anchor="middle" font-weight="400">Apply changes</text><rect x="243" y="368" width="105" height="42" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="295.5" y="396" font-size="19" fill="#245c82" text-anchor="middle" font-weight="400">Back</text><rect x="490" y="95" width="600" height="370" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="510" y="135" font-size="25" fill="#245c82" text-anchor="start" font-weight="700">Wider view</text><text x="510" y="195" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Borrower:</text><rect x="627" y="165" width="440" height="45" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="639" y="196" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Noah</text><text x="510" y="259" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity:</text><rect x="627" y="229" width="440" height="45" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="639" y="260" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">9</text><text x="510" y="320" font-size="20" fill="#a23a3a" text-anchor="start" font-weight="400">Enter a quantity from 1 to 5.</text><rect x="510" y="368" width="175" height="42" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="597.5" y="396" font-size="19" fill="#245c82" text-anchor="middle" font-weight="400">Apply changes</text><rect x="703" y="368" width="105" height="42" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="755.5" y="396" font-size="19" fill="#245c82" text-anchor="middle" font-weight="400">Back</text><text x="60" y="526" font-size="24" fill="#50616d" text-anchor="start" font-weight="400">Labels stay aligned. Fields receive useful extra width.</text><text x="60" y="567" font-size="24" fill="#50616d" text-anchor="start" font-weight="400">Feedback and action buttons remain visible.</text><text x="60" y="608" font-size="24" fill="#50616d" text-anchor="start" font-weight="400">Keyboard route: input fields → actions; Back returns focus to the list.</text></g></svg>