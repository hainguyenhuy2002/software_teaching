<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Safe Open workflow</title><desc id="desc">Resolve unsaved changes, choose a path and read into a temporary collection. Failure preserves the old dataset; complete validity permits replacement.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Open: check the whole file, then replace the collection</text><rect x="155" y="90" width="810" height="88" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="560" y="124" font-size="25" fill="#245c82" text-anchor="middle" font-weight="700">Resolve unsaved working changes</text><text x="560" y="156" font-size="21" fill="#50616d" text-anchor="middle" font-weight="400">Save, permit replacement, or cancel the request.</text><path d="M560 186 L560 205" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="155" y="215" width="810" height="88" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="560" y="249" font-size="25" fill="#245c82" text-anchor="middle" font-weight="700">Choose a file path</text><text x="560" y="281" font-size="21" fill="#50616d" text-anchor="middle" font-weight="400">Cancel → keep current work.</text><path d="M560 311 L560 330" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="155" y="340" width="810" height="88" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="560" y="374" font-size="25" fill="#245c82" text-anchor="middle" font-weight="700">Read and check a temporary collection</text><text x="560" y="406" font-size="21" fill="#50616d" text-anchor="middle" font-weight="400">Headers, values, dates, catalogue fields and unique IDs.</text><path d="M395 438 L395 472 L270 472 L270 500" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><path d="M725 438 L725 472 L850 472 L850 500" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="510" width="480" height="145" rx="9" fill="#fff0ed" stroke="#a23a3a" stroke-width="2"/><text x="55" y="552" font-size="23" fill="#a23a3a" text-anchor="start" font-weight="400">Any read/check failure</text><text x="55" y="586" font-size="23" fill="#a23a3a" text-anchor="start" font-weight="400">Keep current data, display and path.</text><text x="55" y="620" font-size="23" fill="#a23a3a" text-anchor="start" font-weight="400">Explain the error.</text><rect x="610" y="510" width="480" height="145" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="635" y="552" font-size="23" fill="#126b62" text-anchor="start" font-weight="400">All records valid</text><text x="635" y="586" font-size="23" fill="#126b62" text-anchor="start" font-weight="400">Replace data and refresh the table.</text><text x="635" y="620" font-size="23" fill="#126b62" text-anchor="start" font-weight="400">Clear old selection; update file path.</text></g></svg>