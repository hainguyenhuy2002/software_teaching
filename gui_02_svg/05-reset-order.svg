<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Input write notifications explain reset order</title><desc id="desc">Clear writes each input, triggering immediate change callbacks. It then restores the intended starting feedback after those callbacks finish.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Clear resets inputs first, then the final feedback</text><rect x="30" y="95" width="535" height="78" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="50" y="142" font-size="25" fill="#245c82" text-anchor="start" font-weight="700">Empty the quantity field</text><path d="M575 134 L625 134" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="95" width="450" height="78" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="658" y="125" font-size="20" fill="#126b62" text-anchor="start" font-weight="400">Input-change response runs:</text><text x="658" y="152" font-size="20" fill="#126b62" text-anchor="start" font-weight="400">clear quote; request recalculation</text><rect x="30" y="215" width="535" height="78" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="50" y="262" font-size="25" fill="#245c82" text-anchor="start" font-weight="700">Restore Standard as the ticket type</text><path d="M575 254 L625 254" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="215" width="450" height="78" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="658" y="245" font-size="20" fill="#126b62" text-anchor="start" font-weight="400">Input-change response runs:</text><text x="658" y="272" font-size="20" fill="#126b62" text-anchor="start" font-weight="400">clear quote; request recalculation</text><rect x="30" y="335" width="535" height="78" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="50" y="382" font-size="25" fill="#245c82" text-anchor="start" font-weight="700">Remove the session choice</text><path d="M575 374 L625 374" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="335" width="450" height="78" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="658" y="365" font-size="20" fill="#126b62" text-anchor="start" font-weight="400">Input-change response runs:</text><text x="658" y="392" font-size="20" fill="#126b62" text-anchor="start" font-weight="400">clear quote; request recalculation</text><path d="M290 181 L290 205" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><path d="M290 301 L290 325" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><path d="M290 421 L290 455" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="110" y="465" width="900" height="125" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="140" y="501" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">After the input writes:</text><text x="140" y="532" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">quote = &quot;Quote: --&quot;; status = the starting instruction</text><text x="140" y="563" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Request focus for the quantity field.</text><text x="55" y="640" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">Write the starting instruction after the input resets have finished.</text></g></svg>