<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">Four actions show changes in inputs and outputs</title><desc id="desc">A standard Morning quote is followed by Member selection which clears it, a fresh member quote, and a complete reset to initial values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Follow the state after each complete action</text><rect x="20" y="85" width="500" height="235" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="38" y="121" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">1  Calculate Standard</text><text x="40" y="167" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity: &quot;3&quot;    Type: standard</text><text x="40" y="199" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Session: Morning</text><text x="40" y="244" font-size="24" fill="#126b62" text-anchor="start" font-weight="700">Quote: ... $36.00</text><text x="40" y="290" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">A quote for the current inputs.</text><rect x="600" y="85" width="500" height="235" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="618" y="121" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">2  Select Member</text><text x="620" y="167" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity: &quot;3&quot;    Type: member</text><text x="620" y="199" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Session: Morning</text><text x="620" y="244" font-size="24" fill="#126b62" text-anchor="start" font-weight="700">Quote: --</text><text x="620" y="290" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">Ready for another Calculate action.</text><rect x="20" y="430" width="500" height="235" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="38" y="466" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">3  Calculate Member</text><text x="40" y="512" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity: &quot;3&quot;    Type: member</text><text x="40" y="544" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Session: Morning</text><text x="40" y="589" font-size="24" fill="#126b62" text-anchor="start" font-weight="700">Quote: ... $30.00</text><text x="40" y="635" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">Repeated Calculate still gives $30.00.</text><rect x="600" y="430" width="500" height="235" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="618" y="466" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">4  Activate Clear</text><text x="620" y="512" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Quantity: &quot;&quot;    Type: standard</text><text x="620" y="544" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Session: &quot;&quot;</text><text x="620" y="589" font-size="24" fill="#126b62" text-anchor="start" font-weight="700">Quote: --</text><text x="620" y="635" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">Starting instruction restored.</text><path d="M535 202 L585 202" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><path d="M850 333 L850 365 L270 365 L270 415" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><path d="M535 547 L585 547" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="395" font-size="22" fill="#245c82" text-anchor="middle" font-weight="400">Next action: Calculate</text><text x="560" y="725" font-size="21" fill="#50616d" text-anchor="middle" font-weight="400">The abbreviated quote amounts here correspond to the full quote text in the guide.</text></g></svg>