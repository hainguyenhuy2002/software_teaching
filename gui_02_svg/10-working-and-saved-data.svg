<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="665" viewBox="0 0 1120 665" role="img" aria-labelledby="title desc">
<title id="title">Draft, working data, table and saved file</title><desc id="desc">Apply validates a draft into working records. Refresh updates the table. Save writes the file and Open loads a checked replacement collection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Know which copy an action changes</text><rect x="30" y="105" width="350" height="130" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="205" y="149" font-size="26" fill="#245c82" text-anchor="middle" font-weight="700">Draft fields</text><text x="205" y="193" font-size="22" fill="#50616d" text-anchor="middle" font-weight="400">Unapplied input</text><rect x="455" y="105" width="610" height="130" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="760" y="149" font-size="26" fill="#126b62" text-anchor="middle" font-weight="700">Accepted working records</text><text x="760" y="193" font-size="22" fill="#50616d" text-anchor="middle" font-weight="400">The application’s current dataset</text><path d="M390 170 L440 170" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><text x="415" y="92" font-size="21" fill="#245c82" text-anchor="middle" font-weight="700">Apply</text><rect x="450" y="350" width="300" height="125" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="600" y="395" font-size="25" fill="#245c82" text-anchor="middle" font-weight="700">Table display</text><text x="600" y="438" font-size="20" fill="#50616d" text-anchor="middle" font-weight="400">Rows rebuilt from records</text><rect x="805" y="350" width="285" height="125" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="947" y="395" font-size="25" fill="#245c82" text-anchor="middle" font-weight="700">Saved CSV file</text><text x="947" y="438" font-size="22" fill="#50616d" text-anchor="middle" font-weight="400">A copy on disk</text><path d="M600 245 L600 335" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="295" font-size="22" fill="#245c82" text-anchor="start" font-weight="700">Refresh</text><path d="M900 245 L900 335" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><text x="910" y="295" font-size="22" fill="#245c82" text-anchor="start" font-weight="700">Save</text><path d="M1060 340 L1100 340 L1100 260 L1035 260 L1035 240" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><text x="1020" y="303" font-size="20" fill="#245c82" text-anchor="middle" font-weight="400">Open</text><text x="50" y="410" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">Draft fields hold</text><text x="50" y="441" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">the pending edits.</text><text x="50" y="472" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">Apply accepts them.</text><rect x="120" y="520" width="880" height="105" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="560" y="559" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">Apply changes → working records. Refresh → table.</text><text x="560" y="598" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">Save file → disk. Open file → checked replacement records.</text></g></svg>