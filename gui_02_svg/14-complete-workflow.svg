<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Add edit save restart and reload test</title><desc id="desc">Six stages begin with three loans, add L104, edit L102, save, restart and reopen, then verify four IDs and L102 quantity three.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Test the full path, including a fresh start</text><rect x="30" y="100" width="320" height="190" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="50" y="143" font-size="27" fill="#245c82" text-anchor="start" font-weight="700">1. Start</text><text x="50" y="200" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">3 sample loans</text><text x="50" y="242" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">L102 quantity 2</text><path d="M360 194 L383 194" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="100" width="320" height="190" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="420" y="143" font-size="27" fill="#245c82" text-anchor="start" font-weight="700">2. Add</text><text x="420" y="200" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Create L104</text><text x="420" y="242" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">4 loans; unsaved</text><path d="M730 194 L753 194" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="100" width="320" height="190" rx="9" fill="#e7f3ee" stroke="#245c82" stroke-width="2"/><text x="790" y="143" font-size="27" fill="#245c82" text-anchor="start" font-weight="700">3. Edit</text><text x="790" y="200" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">L102: 2 → 3</text><text x="790" y="242" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">4 loans; unsaved</text><rect x="30" y="370" width="320" height="190" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="50" y="413" font-size="27" fill="#245c82" text-anchor="start" font-weight="700">4. Save</text><text x="50" y="470" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Write all 4 loans</text><text x="50" y="512" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Saved status</text><path d="M360 464 L383 464" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="370" width="320" height="190" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="420" y="413" font-size="27" fill="#245c82" text-anchor="start" font-weight="700">5. Restart</text><text x="420" y="470" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Memory is rebuilt</text><text x="420" y="512" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Open the CSV file</text><path d="M730 464 L753 464" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="370" width="320" height="190" rx="9" fill="#e7f3ee" stroke="#245c82" stroke-width="2"/><text x="790" y="413" font-size="27" fill="#245c82" text-anchor="start" font-weight="700">6. Check</text><text x="790" y="470" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">4 IDs restored</text><text x="790" y="512" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">L102 quantity 3</text><path d="M930 300 L930 325 L190 325 L190 355" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="650" font-size="24" fill="#245c82" text-anchor="middle" font-weight="700">Check exact IDs and field values at each stage.</text></g></svg>