<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Draft validation preserves accepted records</title><desc id="desc">An edit draft with quantity nine is rejected while L102 remains at two. Correcting the draft to three and applying updates both the stored record and row.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Edit a draft before changing the accepted record</text><rect x="30" y="100" width="310" height="265" rx="9" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="50" y="144" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Accepted L102</text><text x="50" y="202" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Borrower: Noah</text><text x="50" y="250" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Quantity: 2</text><text x="50" y="298" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Table shows: 2</text><rect x="405" y="100" width="310" height="265" rx="9" fill="#fff0ed" stroke="#b9cbd6" stroke-width="2"/><text x="425" y="144" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Draft fields</text><text x="425" y="202" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Borrower: Noah</text><text x="425" y="250" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Quantity: 9</text><text x="425" y="298" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Apply changes</text><rect x="780" y="100" width="310" height="265" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="800" y="144" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">After correction</text><text x="800" y="202" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Draft quantity: 3</text><text x="800" y="250" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Apply succeeds</text><text x="800" y="298" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Record + row: 3</text><path d="M350 226 L390 226" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><path d="M725 226 L765 226" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="425" width="470" height="110" rx="9" fill="#fff0ed" stroke="#a23a3a" stroke-width="2"/><text x="85" y="465" font-size="24" fill="#a23a3a" text-anchor="start" font-weight="400">Quantity 9 is rejected.</text><text x="85" y="499" font-size="24" fill="#a23a3a" text-anchor="start" font-weight="400">Accepted record stays at 2.</text><rect x="590" y="425" width="470" height="110" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="615" y="465" font-size="24" fill="#126b62" text-anchor="start" font-weight="400">Quantity 3 is accepted.</text><text x="615" y="499" font-size="24" fill="#126b62" text-anchor="start" font-weight="400">Mark the file data unsaved.</text><text x="560" y="593" font-size="24" fill="#245c82" text-anchor="middle" font-weight="700">Enter a draft → validate → accept → save to file.</text></g></svg>