<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">One shared variable controls the radio group</title><desc id="desc">The shared value member selects the Member radio button. Each button has its own value connected to that shared variable.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Radio selection is a match against one shared value</text><rect x="330" y="95" width="460" height="115" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="560" y="138" font-size="27" fill="#245c82" text-anchor="middle" font-weight="700">ticket_type_var</text><text x="560" y="182" font-size="29" fill="#126b62" text-anchor="middle" font-weight="700">&quot;member&quot;</text><path d="M450 215 L450 255 L270 255 L270 300" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><path d="M670 215 L670 255 L850 255 L850 300" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="310" width="500" height="170" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><circle cx="75" cy="354" r="12" fill="white" stroke="#245c82" stroke-width="2"/><text x="105" y="362" font-size="25" fill="#172b38" text-anchor="start" font-weight="700">Standard ($12)</text><text x="65" y="408" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">value=&quot;standard&quot;</text><text x="65" y="439" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Button state: unselected</text><rect x="580" y="310" width="500" height="170" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><circle cx="615" cy="354" r="12" fill="white" stroke="#245c82" stroke-width="2"/><circle cx="615" cy="354" r="6" fill="#245c82"/><text x="645" y="362" font-size="25" fill="#126b62" text-anchor="start" font-weight="700">Member ($10)</text><text x="605" y="408" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">value=&quot;member&quot;</text><text x="605" y="439" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Button state: selected</text><text x="65" y="535" font-size="23" fill="#50616d" text-anchor="start" font-weight="400">Both controls use variable=ticket_type_var.</text><text x="65" y="566" font-size="23" fill="#50616d" text-anchor="start" font-weight="400">Selecting Standard writes &quot;standard&quot;; the visual selection then reverses.</text></g></svg>