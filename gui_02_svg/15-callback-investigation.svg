<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Breakpoints locate the first identity mismatch</title><desc id="desc">Four checkpoints inspect selected ID, target record, converted draft and updated row. Trace the selected ID through record lookup, validation and display refresh.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Find the first incorrect value in the callback path</text><rect x="25" y="110" width="245" height="245" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="42" y="154" font-size="22" fill="#245c82" text-anchor="start" font-weight="700">1. Read selection</text><text x="42" y="220" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Selected ID</text><text x="42" y="268" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">L102</text><path d="M275 235 L295 235" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="305" y="110" width="245" height="245" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="322" y="154" font-size="22" fill="#245c82" text-anchor="start" font-weight="700">2. Find record</text><text x="322" y="220" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Target borrower</text><text x="322" y="268" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Noah</text><path d="M555 235 L575 235" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="585" y="110" width="245" height="245" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="602" y="154" font-size="22" fill="#245c82" text-anchor="start" font-weight="700">3. Check draft</text><text x="602" y="220" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Converted quantity</text><text x="602" y="268" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">3</text><path d="M835 235 L855 235" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="865" y="110" width="245" height="245" rx="9" fill="#e7f3ee" stroke="#245c82" stroke-width="2"/><text x="882" y="154" font-size="22" fill="#245c82" text-anchor="start" font-weight="700">4. Update + refresh</text><text x="882" y="220" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">Record and row</text><text x="882" y="268" font-size="22" fill="#172b38" text-anchor="start" font-weight="400">L102 → 3</text><rect x="100" y="420" width="920" height="130" rx="9" fill="#fff0ed" stroke="#a23a3a" stroke-width="2"/><text x="130" y="464" font-size="23" fill="#a23a3a" text-anchor="start" font-weight="400">Selected ID: L102. Lookup result: L101.</text><text x="130" y="498" font-size="23" fill="#a23a3a" text-anchor="start" font-weight="400">Trace lookup to find how that result was selected.</text><text x="130" y="532" font-size="23" fill="#a23a3a" text-anchor="start" font-weight="400">Use the selected ID to retrieve the target record.</text><text x="560" y="607" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">After repair: rerun the failed sequence and related passing cases.</text></g></svg>