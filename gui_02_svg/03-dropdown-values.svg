<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="655" viewBox="0 0 1120 655" role="img" aria-labelledby="title desc">
<title id="title">Dropdown states and allowed values</title><desc id="desc">Normal allows typing, readonly allows only user selection, disabled blocks interaction. A blank initial selection still needs a validation check.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Choose a control state that fits the requirement</text><rect x="30" y="95" width="310" height="260" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="50" y="135" font-size="27" fill="#245c82" text-anchor="start" font-weight="700">normal</text><rect x="50" y="157" width="270" height="46" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="65" y="188" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Evening</text><text x="299" y="188" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">v</text><text x="50" y="255" font-size="21" fill="#50616d" text-anchor="start" font-weight="400">Typing is permitted.</text><text x="50" y="286" font-size="21" fill="#50616d" text-anchor="start" font-weight="400">The text may be unlisted.</text><rect x="405" y="95" width="310" height="260" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="425" y="135" font-size="27" fill="#245c82" text-anchor="start" font-weight="700">readonly</text><rect x="425" y="157" width="270" height="46" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="440" y="188" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Morning</text><text x="674" y="188" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">v</text><text x="425" y="255" font-size="21" fill="#50616d" text-anchor="start" font-weight="400">Choose from the list.</text><text x="425" y="286" font-size="21" fill="#50616d" text-anchor="start" font-weight="400">Selection supplies the text.</text><rect x="780" y="95" width="310" height="260" rx="9" fill="#f1f3f5" stroke="#b9cbd6" stroke-width="2"/><text x="800" y="135" font-size="27" fill="#245c82" text-anchor="start" font-weight="700">disabled</text><rect x="800" y="157" width="270" height="46" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="815" y="188" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Morning</text><text x="1049" y="188" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">v</text><text x="800" y="255" font-size="21" fill="#50616d" text-anchor="start" font-weight="400">Displays the current value.</text><text x="800" y="286" font-size="21" fill="#50616d" text-anchor="start" font-weight="400">Interaction is switched off.</text><rect x="155" y="408" width="810" height="150" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="185" y="448" font-size="24" fill="#172b38" text-anchor="start" font-weight="400">Allowed values: (&quot;Morning&quot;, &quot;Afternoon&quot;)</text><text x="185" y="479" font-size="24" fill="#172b38" text-anchor="start" font-weight="400">Initial stored value: &quot;&quot;  -&gt;  blank session field</text><text x="185" y="510" font-size="24" fill="#172b38" text-anchor="start" font-weight="400">Calculate checks that the session is an allowed option.</text><text x="55" y="612" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">Check each stored session against the allowed values.</text></g></svg>