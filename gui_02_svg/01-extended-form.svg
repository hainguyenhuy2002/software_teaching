<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc">
<title id="title">Extended quotation form</title><desc id="desc">Quantity 3, Standard and Morning are selected. The form shows a 36 dollar quote and Calculate, Clear and Cancel actions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="50" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">One form, three inputs and three distinct actions</text><rect x="140" y="80" width="840" height="530" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><rect x="140" y="80" width="840" height="50" rx="9" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><text x="165" y="113" font-size="25" fill="#245c82" text-anchor="start" font-weight="700">Club ticket calculator</text><text x="185" y="182" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Number of tickets (1-5):</text><rect x="600" y="150" width="110" height="44" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="620" y="181" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">3</text><text x="185" y="247" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Ticket type:</text><circle cx="612" cy="239" r="12" fill="white" stroke="#245c82" stroke-width="2"/><circle cx="612" cy="239" r="6" fill="#245c82"/><text x="640" y="247" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Standard ($12)</text><circle cx="612" cy="292" r="12" fill="white" stroke="#245c82" stroke-width="2"/><text x="640" y="300" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Member ($10)</text><text x="185" y="361" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Session:</text><rect x="600" y="329" width="260" height="46" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="619" y="360" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Morning</text><text x="833" y="360" font-size="22" fill="#245c82" text-anchor="start" font-weight="400">v</text><rect x="185" y="408" width="240" height="48" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="305.0" y="440" font-size="22" fill="#245c82" text-anchor="middle" font-weight="400">Calculate total</text><rect x="450" y="408" width="130" height="48" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="515.0" y="440" font-size="22" fill="#245c82" text-anchor="middle" font-weight="400">Clear</text><rect x="605" y="408" width="130" height="48" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="670.0" y="440" font-size="22" fill="#245c82" text-anchor="middle" font-weight="400">Cancel</text><text x="185" y="516" font-size="24" fill="#126b62" text-anchor="start" font-weight="700">Quote: 3 standard tickets, Morning: $36.00</text><text x="185" y="563" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">Quote ready.</text><text x="165" y="660" font-size="23" fill="#50616d" text-anchor="start" font-weight="400">Morning and Afternoon use the same ticket prices.</text></g></svg>