<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="815" viewBox="0 0 1120 815" role="img" aria-labelledby="title desc">
<title id="title">Write callback clears output and Calculate makes a quote</title><desc id="desc">Three input writes notify the same handler. It removes the quote. A later explicit Calculate action validates the current inputs and creates a result or an error.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Follow an input change through to a fresh quote</text><rect x="30" y="85" width="300" height="72" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="180" y="130" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">Quantity edit</text><rect x="410" y="85" width="300" height="72" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="560" y="130" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">Ticket-type choice</text><rect x="790" y="85" width="300" height="72" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="940" y="130" font-size="23" fill="#245c82" text-anchor="middle" font-weight="700">Session choice</text><path d="M180 165 L180 195 L560 195 L560 225" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><path d="M560 165 L560 225" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><path d="M940 165 L940 195 L560 195" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="250" y="235" width="620" height="110" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="560" y="277" font-size="26" fill="#126b62" text-anchor="middle" font-weight="700">Input-change response</text><text x="560" y="319" font-size="24" fill="#172b38" text-anchor="middle" font-weight="400">Clear quote; request a new calculation.</text><path d="M560 353 L560 395" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="405" width="520" height="65" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="560" y="448" font-size="27" fill="#126b62" text-anchor="middle" font-weight="700">Quote: --</text><text x="560" y="512" font-size="23" fill="#50616d" text-anchor="middle" font-weight="400">Later, the user activates Calculate</text><path d="M560 525 L560 560" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="570" width="520" height="70" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="560" y="613" font-size="25" fill="#245c82" text-anchor="middle" font-weight="700">Check the current inputs</text><path d="M560 648 L560 690" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="210" y="700" width="700" height="75" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="560" y="731" font-size="22" fill="#126b62" text-anchor="middle" font-weight="700">Valid input -&gt; display a fresh quote</text><text x="560" y="761" font-size="22" fill="#126b62" text-anchor="middle" font-weight="400">Invalid input -&gt; display an error; quote stays empty.</text></g></svg>