<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Listbox and Treeview record displays</title><desc id="desc">Three loan records appear in a compact Listbox and a column-based Treeview. L102 is selected in both.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" font-size="28" fill="#245c82" text-anchor="start" font-weight="700">Choose a display that fits the information</text><rect x="30" y="90" width="355" height="370" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="50" y="130" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Listbox: one line per loan</text><rect x="50" y="160" width="315" height="47" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="62" y="190" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">L101 — Camera — Mai</text><rect x="50" y="220" width="315" height="47" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="62" y="250" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">L102 — Mic — Noah</text><rect x="50" y="280" width="315" height="47" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="62" y="310" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">L103 — Camera — Ava</text><text x="50" y="385" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">Compact labels.</text><text x="50" y="416" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">Keep an ID mapping.</text><rect x="415" y="90" width="675" height="370" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="435" y="130" font-size="24" fill="#245c82" text-anchor="start" font-weight="700">Treeview: fields in columns</text><rect x="435" y="165" width="630" height="192" rx="3" fill="white" stroke="#b9cbd6" stroke-width="2"/><rect x="435" y="165" width="630" height="48" rx="3" fill="#edf5fa" stroke="#b9cbd6" stroke-width="2"/><rect x="437" y="261" width="626" height="48" fill="#e7f3ee"/><text x="447" y="196" font-size="19" fill="#245c82" text-anchor="start" font-weight="700">ID</text><text x="552" y="196" font-size="19" fill="#245c82" text-anchor="start" font-weight="700">Item</text><text x="732" y="196" font-size="19" fill="#245c82" text-anchor="start" font-weight="700">Borrower</text><text x="957" y="196" font-size="19" fill="#245c82" text-anchor="start" font-weight="700">Qty</text><text x="447" y="244" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">L101</text><text x="552" y="244" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">Camera</text><text x="732" y="244" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">Mai</text><text x="957" y="244" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">1</text><path d="M435 213 H1065" stroke="#b9cbd6"/><text x="447" y="292" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">L102</text><text x="552" y="292" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">Mic</text><text x="732" y="292" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">Noah</text><text x="957" y="292" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">2</text><path d="M435 261 H1065" stroke="#b9cbd6"/><text x="447" y="340" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">L103</text><text x="552" y="340" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">Camera</text><text x="732" y="340" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">Ava</text><text x="957" y="340" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">1</text><path d="M435 309 H1065" stroke="#b9cbd6"/><text x="435" y="410" font-size="22" fill="#50616d" text-anchor="start" font-weight="400">Compare the same field down one column.</text><rect x="95" y="510" width="930" height="95" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="120" y="547" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">The working collection supplies the rows shown in the display.</text><text x="120" y="578" font-size="23" fill="#172b38" text-anchor="start" font-weight="400">Choose summary fields; show additional fields in the detail form.</text></g></svg>