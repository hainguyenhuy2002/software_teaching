<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="735" viewBox="0 0 1120 735" role="img" aria-labelledby="title desc">
<title id="title">Independent two-view booking interface</title><desc id="desc">A booking list with stable IDs and file actions opens a separate detail form with a name, workshop, session radio group, places and Apply or Back actions.</desc>
