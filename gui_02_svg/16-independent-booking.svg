xt-anchor="start" font-weight="400">v</text><text x="610" y="324" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Session:</text><circle cx="787" cy="316" r="12" fill="white" stroke="#245c82" stroke-width="2"/><circle cx="787" cy="316" r="6" fill="#245c82"/><text x="808" y="324" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">Morning</text><circle cx="932" cy="316" r="12" fill="white" stroke="#245c82" stroke-width="2"/><text x="953" y="324" font-size="19" fill="#172b38" text-anchor="start" font-weight="400">Afternoon</text><text x="610" y="371" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">Places:</text><rect x="775" y="342" width="100" height="40" rx="9" fill="white" stroke="#b9cbd6" stroke-width="2"/><text x="787" y="371" font-size="21" fill="#172b38" text-anchor="start" font-weight="400">4</text><text x="893" y="371" font-size="20" fill="#50616d" text-anchor="start" font-weight="400">draft</text><rect x="610" y="444" width="185" height="42" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="702.5" y="472" font-size="19" fill="#245c82" text-anchor="middle" font-weight="400">Apply changes</text><rect x="815" y="444" width="105" height="42" rx="9" fill="#edf5fa" stroke="#245c82" stroke-width="2"/><text x="867.5" y="472" font-size="19" fill="#245c82" text-anchor="middle" font-weight="400">Back</text><path d="M545 245 L575 245" fill="none" stroke="#245c82" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="580" width="920" height="110" rx="9" fill="#e7f3ee" stroke="#b9cbd6" stroke-width="2"/><text x="130" y="620" font-size="23" fill="#126b62" text-anchor="start" font-weight="400">Build both views; complete Add and Edit; connect the file functions.</text><text x="130" y="657" font-size="23" fill="#126b62" text-anchor="start" font-weight="400">Prove success, rejection, cancellation and a save–reload round trip.</text></g></svg>